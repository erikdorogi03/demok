<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dorogi Digital · Bemutató oldalak</title>
<style>
:root{--bg:#F1F4FA;--card:#fff;--fg:#111A2C;--muted:#56627D;--accent:#2A64DE;--line:#D7DEEB}
@media (prefers-color-scheme:dark){:root{--bg:#0C111D;--card:#131A2A;--fg:#E8EDF7;--muted:#949FB8;--accent:#5E9BFF;--line:#26304A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:480px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px;text-align:center}
.mark{width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:26px;margin:0 auto 16px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 12px;color:var(--muted)}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">D</div>
  <h1>Dorogi Digital bemutató oldalak</h1>
  <p>Itt vannak az ügyfeleknek készült bemutató weboldalak. A saját bemutató oldalad pontos linkjét tőlem kaptad meg.</p>
  <p>Kérdésed van? Hívj nyugodtan: <a href="tel:+36304899441">+36 30 489 9441</a></p>
</main>
</body>
</html>
